<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluación de Marca — Prospecting People</title>
<meta name="description" content="Evaluación rápida de qué tan lista está tu marca para invertir en contenido y publicidad.">
<style>
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  /* Token plan: fondo casi negro editorial + glow rojo->morado de marca (el
     mismo gradiente del logo neón) como acento de luz, nunca como "gamer HUD"
     — nada de grid lines ni Orbitron aquí, es una pieza de agencia premium.
     Tipografía: Fraunces (display, editorial) + Inter (cuerpo). Layout: una
     tarjeta centrada con glow lateral, header tipo hero antes del paso 1. */
  :root {
    --bg: #0B0A10;
    --bg-2: #141019;
    --surface: #17141F;
    --surface-2: #1D1826;
    --border: #2C2636;
    --fg: #F4F2F8;
    --fg-muted: #8D86A1;
    --accent: #7C3AED;
    --accent-2: #EF4444;
    --good: #34D399;
    --warn: #FBBF24;
    --crit: #F87171;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(760px 420px at 12% -8%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 70%),
      radial-gradient(900px 520px at 100% 8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 65%),
      radial-gradient(600px 400px at 50% 100%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 36px;
    min-height: 100%;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  /* ── HERO / MEMBRETE ─────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 30px; }
  .hero .logo-row { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .hero .logo-row img { width: 56px; height: auto; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent-2) 70%, transparent)) drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 60%, transparent)); }
  .hero .wordmark { text-align: left; }
  .hero .wordmark .name { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; letter-spacing: 0.01em; color: #fff; }
  .hero .wordmark .tag { font-size: 0.68rem; color: var(--fg-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .hero h1.title {
    font-family: var(--font-display); font-weight: 600; text-wrap: balance;
    font-size: clamp(1.5rem, 5vw, 2.1rem); margin: 0 0 8px;
    background: linear-gradient(100deg, #fff 30%, color-mix(in srgb, var(--accent-2) 70%, #fff) 60%, color-mix(in srgb, var(--accent) 70%, #fff) 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .subtitle { color: var(--fg-muted); font-size: 0.92rem; max-width: 46ch; margin: 0 auto; }
  .hero .rule { height: 1px; margin: 24px auto 0; width: 100%; max-width: 420px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent-2) 70%, transparent), color-mix(in srgb, var(--accent) 70%, transparent), transparent); }

  .progress-track {
    height: 6px; border-radius: 99px; background: var(--surface-2);
    overflow: hidden; margin-bottom: 26px; border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 99px; transition: width 0.4s ease;
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
    width: 0%;
  }

  /* ── TARJETA — luz por el lado izquierdo, como pedido ────── */
  .card-shell { position: relative; }
  .card-shell::before {
    content: ""; position: absolute; left: -1px; top: 10%; bottom: 10%; width: 4px;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    box-shadow: 0 0 22px 2px color-mix(in srgb, var(--accent) 65%, transparent),
                0 0 22px 2px color-mix(in srgb, var(--accent-2) 45%, transparent);
  }
  .card {
    background: linear-gradient(165deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset,
                -14px 0 40px -22px color-mix(in srgb, var(--accent) 80%, transparent),
                0 24px 60px -24px rgba(0,0,0,0.6);
    border-radius: 20px; padding: 34px 30px;
    min-height: 360px; display: flex; flex-direction: column;
    animation: cardIn 0.38s cubic-bezier(.21,.9,.32,1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  .step-eyebrow {
    font-size: 0.76rem; color: var(--fg-muted); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .step-eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2); box-shadow: 0 0 6px var(--accent-2); }
  h1.q {
    font-family: var(--font-display); font-weight: 600; color: #fff;
    font-size: clamp(1.3rem, 4vw, 1.7rem); line-height: 1.3;
    margin: 0 0 6px; text-wrap: balance;
  }
  .q-help { color: var(--fg-muted); font-size: 0.92rem; margin: 0 0 22px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.86rem; font-weight: 600; margin-bottom: 7px; color: var(--fg); }
  .field input, .field select {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--fg);
    font-size: 0.95rem; font-family: var(--font-body);
  }
  .field input::placeholder { color: color-mix(in srgb, var(--fg-muted) 80%, transparent); }
  .field input:focus, .field select:focus, .opt:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
  }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--border); border-radius: 12px;
    padding: 15px 16px; cursor: pointer; background: var(--bg-2);
    font-size: 0.95rem; text-align: left; color: var(--fg);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, box-shadow .15s ease;
  }
  .opt:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); transform: translateX(2px); }
  .opt.selected {
    border-color: var(--accent);
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface));
    font-weight: 600;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 18px -6px var(--accent);
  }
  .opt .dot {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border);
    flex: none; display: flex; align-items: center; justify-content: center;
  }
  .opt.selected .dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .opt .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; display: none; }
  .opt.selected .dot::after { display: block; }

  .spacer { flex: 1; }
  .nav { display: flex; gap: 10px; margin-top: 24px; }
  button {
    font-family: var(--font-body); font-size: 0.95rem; font-weight: 600;
    border-radius: 10px; padding: 13px 22px; border: none; cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease, box-shadow .15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(100deg, var(--accent-2), var(--accent)); color: white; margin-left: auto;
    box-shadow: 0 6px 20px -8px color-mix(in srgb, var(--accent) 80%, transparent);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 26px -8px color-mix(in srgb, var(--accent) 95%, transparent); }
  .btn-ghost { background: transparent; color: var(--fg-muted); }
  .btn-ghost:hover { color: var(--fg); }

  .result-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px; border-radius: 99px; font-size: 0.8rem; font-weight: 700;
    letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 18px;
  }
  .badge-good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); box-shadow: 0 0 16px -6px var(--good); }
  .badge-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); box-shadow: 0 0 16px -6px var(--warn); }
  .badge-crit { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); box-shadow: 0 0 16px -6px var(--crit); }

  /* ── ANILLO DE PUNTAJE (interactivo: se dibuja con una transición) ── */
  .score-ring-wrap { display: flex; justify-content: center; margin: 6px 0 20px; }
  .ring { width: 168px; height: 168px; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--surface-2); }
  .ring .fill {
    stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.9s cubic-bezier(.21,.9,.32,1);
  }
  .ring-label { font-family: var(--font-display); font-size: 2.1rem; font-weight: 600; fill: #fff; }

  .breakdown { display: flex; flex-direction: column; gap: 11px; margin: 18px 0; }
  .breakdown-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .breakdown-row .label { font-size: 0.85rem; color: var(--fg-muted); width: 150px; flex: none; }
  .breakdown-row .bar-track { flex: 1; min-width: 0; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .breakdown-row .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.6s ease; }
  .breakdown-row .pts { font-size: 0.8rem; color: var(--fg-muted); width: 54px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  .next-steps { background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-top: 10px; }
  .next-steps p { margin: 0 0 8px; font-size: 0.9rem; color: var(--fg-muted); }
  .next-steps p:last-child { margin-bottom: 0; }
  .next-steps strong { color: var(--fg); }

  .error-text { color: var(--crit); font-size: 0.85rem; margin-top: 8px; display: none; }
  .error-text.show { display: block; }

  .foot-note { text-align: center; color: var(--fg-muted); font-size: 0.74rem; margin-top: 20px; letter-spacing: 0.02em; }
  .owner-link { text-align: center; margin-top: 14px; }
  .owner-link a { color: var(--fg-muted); font-size: 0.82rem; text-decoration: none; border-bottom: 1px dotted var(--fg-muted); }
  .owner-link a:hover { color: var(--fg); border-color: var(--fg); }
  .admin-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .admin-row { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg-2); }
  .admin-row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .admin-row-top strong { color: #fff; font-family: var(--font-display); font-size: 1rem; }
  .admin-row .lead-meta { font-size: 0.82rem; color: var(--fg-muted); margin-top: 2px; }

  @media (max-width: 480px) {
    .card { padding: 26px 20px; }
    .hero .logo-row { flex-direction: column; }
    .hero .wordmark { text-align: center; }
  }
</style>

      id: "pagos",
      q: "¿Tienes cómo recibir pagos ya mismo?",
      help: "Nequi, Bancolombia, link de pago, Daviplata, lo que sea que ya uses.",
      opts: [
        { label: "Sí, tengo un método claro", pts: 15 },
        { label: "A medias (solo efectivo o transferencia personal)", pts: 7 },
        { label: "No tengo nada de esto", pts: 0 }
      ]
    },
    {
      id: "capacidad",
      q: "Si de pronto te llegan muchos más clientes la próxima semana, ¿podrías atenderlos?",
      help: "Esta es clave — de nada sirve que la publicidad funcione si no puedes responder a la demanda.",
      opts: [
        { label: "Sí, sin problema", pts: 15 },
        { label: "Con algo de esfuerzo, sí podría", pts: 7 },
        { label: "No, me desbordaría ahora mismo", pts: 0 }
      ]
    },
    {
      id: "material",
      q: "¿Tienes fotos o videos propios de tu producto o servicio?",
      opts: [
        { label: "Sí, buena cantidad", pts: 15 },
        { label: "Algunas, pero pocas", pts: 7 },
        { label: "No tengo nada todavía", pts: 0 }
      ]
    }
  ];

  // Pasos no puntuados: datos de contacto, datos del negocio (sector/nicho/
  // micronicho) y expectativas — se guardan tal cual, nunca se inventan ni
  // se fuerzan si el prospecto no los sabe (quedan vacíos, honesto).
  var TOTAL_STEPS = 2 + QUESTIONS.length + 1; // contacto + negocio + preguntas + expectativas (resultado no cuenta)

  var state = {
    step: 0,
    datos: {
      marca: "", responsable: "", correo: "", celular: "", categoria: "", instagram: "",
      sector: "", nicho: "", micronicho: "", tiempo_operando: "", expectativas: ""
    },
    respuestas: {} // id -> {label, pts}
  };

  var cardEl = document.getElementById("card");
  var fillEl = document.getElementById("progressFill");

  function updateProgress() {
    var pct = Math.min(100, Math.round((state.step / TOTAL_STEPS) * 100));
    fillEl.style.width = pct + "%";
  }

  function render() {
    updateProgress();
    if (state.step === 0) return renderContacto();
    if (state.step === 1) return renderNegocio();
    var qIndex = state.step - 2;
    if (qIndex < QUESTIONS.length) return renderQuestion(QUESTIONS[qIndex], qIndex);
    if (qIndex === QUESTIONS.length) return renderExpectativas();
    return renderResultado();
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    if (props) for (var k in props) {
      if (k === "class") e.className = props[k];
      else if (k === "html") e.innerHTML = props[k];
      else e.setAttribute(k, props[k]);
    }
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function campoTexto(f) {
    var wrap = el("div", { class: "field" });
    var labelText = f.label + (f.required ? " *" : "");
    wrap.appendChild(el("label", { for: "f_" + f.key }, [document.createTextNode(labelText)]));
    var input = el("input", { id: "f_" + f.key, type: f.type || "text", value: state.datos[f.key] || "", placeholder: f.placeholder || "" });
    input.addEventListener("input", function (e) { state.datos[f.key] = e.target.value; if (f.onInput) f.onInput(); });
    wrap.appendChild(input);
    return wrap;
  }

  function isEmailValido(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v || "").trim());
  }

  function renderContacto() {
    cardEl.innerHTML = "";
    cardEl.appendChild(el("div", { class: "step-eyebrow" }, [document.createTextNode("Paso 1 de " + TOTAL_STEPS)]));
    cardEl.appendChild(el("h1", { class: "q" }, [document.createTextNode("Datos de contacto")]));
    cardEl.appendChild(el("p", { class: "q-help" }, [document.createTextNode("Para poder contactarte con el siguiente paso.")]));

    [
      { key: "marca", label: "Nombre del negocio o marca", required: true },
      { key: "responsable", label: "¿Quién responde esta evaluación?", required: true },
      { key: "correo", label: "Correo electrónico", required: true, type: "email", placeholder: "nombre@correo.com" },
      { key: "celular", label: "Celular / WhatsApp", required: true, type: "tel", placeholder: "300 000 0000" },
      { key: "instagram", label: "Usuario de Instagram (si tienes)", required: false }
    ].forEach(function (f) {
      f.onInput = validateContacto;
      cardEl.appendChild(campoTexto(f));
    });

    var catWrap = el("div", { class: "field" });
    catWrap.appendChild(el("label", { for: "f_categoria" }, [document.createTextNode("¿Es una persona, un producto o un servicio? *")]));
    var sel = el("select", { id: "f_categoria" });
    [["", "Selecciona..."], ["persona", "Persona / marca personal"], ["producto", "Producto"], ["servicio", "Servicio"]].forEach(function (o) {
      var opt = el("option", { value: o[0] }, [document.createTextNode(o[1])]);
      if (state.datos.categoria === o[0]) opt.setAttribute("selected", "selected");
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function (e) { state.datos.categoria = e.target.value; validateContacto(); });
    catWrap.appendChild(sel);
    cardEl.appendChild(catWrap);

    cardEl.appendChild(el("p", { class: "error-text", id: "contactoError" }, [document.createTextNode("Completa marca, responsable, un correo válido, celular y categoría para seguir.")]));

    cardEl.appendChild(el("div", { class: "spacer" }));
    var nav = el("div", { class: "nav" });
    var next = el("button", { class: "btn-primary", id: "nextBtn" }, [document.createTextNode("Siguiente")]);
    next.addEventListener("click", function () { state.step++; render(); });
    nav.appendChild(next);
    cardEl.appendChild(nav);
    validateContacto();
  }

  function validateContacto() {
    var btn = document.getElementById("nextBtn");
    var err = document.getElementById("contactoError");
    var ok = state.datos.marca.trim().length > 0
      && state.datos.responsable.trim().length > 0
      && isEmailValido(state.datos.correo)
      && state.datos.celular.trim().length >= 7
      && state.datos.categoria;
    if (btn) btn.disabled = !ok;
    if (err) err.classList.toggle("show", false);
  }

  function renderNegocio() {
    cardEl.innerHTML = "";
    cardEl.appendChild(el("div", { class: "step-eyebrow" }, [document.createTextNode("Paso 2 de " + TOTAL_STEPS)]));
    cardEl.appendChild(el("h1", { class: "q" }, [document.createTextNode("Sobre el negocio")]));
    cardEl.appendChild(el("p", { class: "q-help" }, [document.createTextNode("Si no sabes alguno con certeza, déjalo en blanco — no hay problema.")]));

    [
      { key: "sector", label: "Sector", placeholder: "Ej: Bienestar y salud, Moda, Tecnología..." },
      { key: "nicho", label: "Nicho", placeholder: "Ej: Entrenamiento funcional" },
      { key: "micronicho", label: "Micronicho", placeholder: "Ej: Entrenamiento en casa para principiantes" }
    ].forEach(function (f) { cardEl.appendChild(campoTexto(f)); });

    var tWrap = el("div", { class: "field" });
    tWrap.appendChild(el("label", { for: "f_tiempo" }, [document.createTextNode("¿Cuánto tiempo lleva operando el negocio?")]));
    var tSel = el("select", { id: "f_tiempo" });
    [["", "Selecciona..."], ["menos_6m", "Menos de 6 meses"], ["6m_2a", "Entre 6 meses y 2 años"], ["mas_2a", "Más de 2 años"]].forEach(function (o) {
      var opt = el("option", { value: o[0] }, [document.createTextNode(o[1])]);
      if (state.datos.tiempo_operando === o[0]) opt.setAttribute("selected", "selected");
      tSel.appendChild(opt);
    });
    tSel.addEventListener("change", function (e) { state.datos.tiempo_operando = e.target.value; });
    tWrap.appendChild(tSel);
    cardEl.appendChild(tWrap);

    cardEl.appendChild(el("div", { class: "spacer" }));
    var nav = el("div", { class: "nav" });
    var back = el("button", { class: "btn-ghost" }, [document.createTextNode("Atrás")]);
    back.addEventListener("click", function () { state.step--; render(); });
    nav.appendChild(back);
    var next = el("button", { class: "btn-primary" }, [document.createTextNode("Siguiente")]);
    next.addEventListener("click", function () { state.step++; render(); });
    nav.appendChild(next);
    cardEl.appendChild(nav);
  }

  function renderQuestion(question, qIndex) {
    cardEl.innerHTML = "";
    cardEl.appendChild(el("div", { class: "step-eyebrow" }, [document.createTextNode("Paso " + (state.step + 1) + " de " + TOTAL_STEPS)]));
    cardEl.appendChild(el("h1", { class: "q" }, [document.createTextNode(question.q)]));
    if (question.help) cardEl.appendChild(el("p", { class: "q-help" }, [document.createTextNode(question.help)]));

    var optsWrap = el("div", { class: "opts" });
    var selected = state.respuestas[question.id];
    question.opts.forEach(function (o) {
      var isSel = selected && selected.label === o.label;
      var opt = el("button", { class: "opt" + (isSel ? " selected" : ""), type: "button" }, [
        el("span", { class: "dot" }),
        document.createTextNode(o.label)
      ]);
      opt.addEventListener("click", function () {
        state.respuestas[question.id] = { label: o.label, pts: o.pts };
        render();
      });
      optsWrap.appendChild(opt);
    });
    cardEl.appendChild(optsWrap);

    cardEl.appendChild(el("div", { class: "spacer" }));
    var nav = el("div", { class: "nav" });
    var back = el("button", { class: "btn-ghost" }, [document.createTextNode("Atrás")]);
    back.addEventListener("click", function () { state.step--; render(); });
    nav.appendChild(back);
    var next = el("button", { class: "btn-primary" }, [document.createTextNode("Siguiente")]);
    next.disabled = !selected;
    next.addEventListener("click", function () { state.step++; render(); });
    nav.appendChild(next);
    cardEl.appendChild(nav);
  }

  function renderExpectativas() {
    cardEl.innerHTML = "";
    cardEl.appendChild(el("div", { class: "step-eyebrow" }, [document.createTextNode("Paso " + (state.step + 1) + " de " + TOTAL_STEPS)]));
    cardEl.appendChild(el("h1", { class: "q" }, [document.createTextNode("¿Qué esperas lograr?")]));
    cardEl.appendChild(el("p", { class: "q-help" }, [document.createTextNode("En tus palabras — más ventas, más reconocimiento, lanzar algo nuevo, lo que sea.")]));

    var wrap = el("div", { class: "field" });
    var textarea = document.createElement("textarea");
    textarea.id = "f_expectativas";
    textarea.rows = 5;
    textarea.value = state.datos.expectativas || "";
    textarea.style.cssText = "width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);color:var(--fg);font-size:0.95rem;font-family:var(--font-body);resize:vertical";
    textarea.addEventListener("input", function (e) { state.datos.expectativas = e.target.value; });
    wrap.appendChild(textarea);
    cardEl.appendChild(wrap);

    cardEl.appendChild(el("div", { class: "spacer" }));
    var nav = el("div", { class: "nav" });
    var back = el("button", { class: "btn-ghost" }, [document.createTextNode("Atrás")]);
    back.addEventListener("click", function () { state.step--; render(); });
    nav.appendChild(back);
    var next = el("button", { class: "btn-primary" }, [document.createTextNode("Ver resultado")]);
    next.addEventListener("click", function () { state.step++; render(); submitIfLast(); });
    nav.appendChild(next);
    cardEl.appendChild(nav);
  }

  function computeScore() {
    var total = 0, max = 0;
    var detalle = [];
    QUESTIONS.forEach(function (q) {
      var r = state.respuestas[q.id];
      var maxPts = Math.max.apply(null, q.opts.map(function (o) { return o.pts; }));
      max += maxPts;
      var pts = r ? r.pts : 0;
      total += pts;
      detalle.push({ id: q.id, q: q.q, pts: pts, max: maxPts });
    });
    return { total: total, max: max, detalle: detalle };
  }

  function tierFor(pct) {
    if (pct >= 71) return { key: "good", label: "Listo para publicidad", badge: "badge-good",
      texto: "La base operativa ya está — tiene sentido invertir en contenido y en que más gente lo vea." };
    if (pct >= 41) return { key: "warn", label: "Base parcial", badge: "badge-warn",
      texto: "Puede empezar, pero con expectativas moderadas — conviene resolver primero lo que falta para no perder el esfuerzo de la publicidad." };
    return { key: "crit", label: "Todavía no está listo", badge: "badge-crit",
      texto: "Antes de pensar en publicidad, vale la pena resolver lo básico — de lo contrario, el contenido no tiene a dónde \"aterrizar\"." };
  }

  var submitted = false;
  function submitIfLast() {
    var qIndex = state.step - 2;
    if (qIndex === QUESTIONS.length + 1 && !submitted) {
      submitted = true;
      saveLead();
    }
  }

  function renderResultado() {
    cardEl.innerHTML = "";
    var score = computeScore();
    var pct = score.max > 0 ? Math.round((score.total / score.max) * 100) : 0;
    var tier = tierFor(pct);

    cardEl.appendChild(el("div", { class: "step-eyebrow" }, [document.createTextNode("Resultado")]));
    cardEl.appendChild(el("div", { class: "badge-wrap" }, [
      el("span", { class: "result-badge " + tier.badge }, [document.createTextNode(tier.label)])
    ]));

    var ringColor = tier.key === "good" ? "var(--good)" : (tier.key === "warn" ? "var(--warn)" : "var(--crit)");
    var R = 72, C = 2 * Math.PI * R;
    var ringWrap = el("div", { class: "score-ring-wrap" });
    ringWrap.innerHTML =
      '<svg class="ring" viewBox="0 0 168 168">' +
        '<circle class="track" cx="84" cy="84" r="' + R + '"></circle>' +
        '<circle class="fill" cx="84" cy="84" r="' + R + '" stroke="' + ringColor + '" ' +
          'stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" ' +
          'style="filter:drop-shadow(0 0 10px ' + ringColor + ')"></circle>' +
        '<text class="ring-label" x="84" y="84" text-anchor="middle" dominant-baseline="central">' + pct + '%</text>' +
      '</svg>';
    cardEl.appendChild(ringWrap);
    requestAnimationFrame(function () {
      var fillCircle = ringWrap.querySelector(".fill");
      if (fillCircle) fillCircle.style.strokeDashoffset = (C - (pct / 100) * C).toString();
    });

    cardEl.appendChild(el("p", { class: "q-help", style: "text-align:center" }, [document.createTextNode(tier.texto)]));

    var breakdown = el("div", { class: "breakdown" });
    score.detalle.forEach(function (d) {
      var row = el("div", { class: "breakdown-row" });
      row.appendChild(el("div", { class: "label" }, [document.createTextNode(shortLabel(d.id))]));
      var track = el("div", { class: "bar-track" });
      var fillPct = d.max > 0 ? Math.round((d.pts / d.max) * 100) : 0;
      var fill = el("div", { class: "bar-fill", style: "width:" + fillPct + "%" });
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div", { class: "pts" }, [document.createTextNode(d.pts + "/" + d.max)]));
      breakdown.appendChild(row);
    });
    cardEl.appendChild(breakdown);

    var next = el("div", { class: "next-steps" });
    next.appendChild(el("p", { html: "<strong>" + escapeHtml(state.datos.marca) + "</strong>, gracias por responder." }));
    next.appendChild(el("p", {}, [document.createTextNode("El equipo de Prospecting People revisa esto y te contacta por " + (state.datos.celular || state.datos.correo || "el contacto que diste") + " con el siguiente paso.")]));
    next.appendChild(el("p", { id: "saveStatus", style: "font-weight:600" }, []));
    cardEl.appendChild(next);

    cardEl.appendChild(el("div", { class: "spacer" }));
  }

  function shortLabel(id) {
    var map = {
      identidad: "Identidad de marca",
      digital: "Presencia digital",
      interaccion: "Interacción real",
      ventas_redes: "Ventas vía redes",
      pagos: "Cómo cobra",
      capacidad: "Capacidad operativa",
      material: "Material propio"
    };
    return map[id] || id;
  }

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  // FORMSPREE_ENDPOINT: reemplazar por el endpoint real una vez creada la
  // cuenta gratuita en https://formspree.io (Sebas, 2026-10-22) — formulario
  // "nuevo formulario", copiar el link que empieza con https://formspree.io/f/...
  var FORMSPREE_ENDPOINT = "https://formspree.io/f/TU_FORM_ID_AQUI";

  var saveStatus = { state: "idle", message: "" }; // idle | saving | ok | error

  function saveLead() {
    if (FORMSPREE_ENDPOINT.indexOf("TU_FORM_ID_AQUI") !== -1) {
      console.warn("Formspree no está configurado todavía — falta reemplazar FORMSPREE_ENDPOINT.");
      saveStatus = { state: "error", message: "El formulario todavía no está conectado — avísale a Sebas." };
      renderSaveStatus();
      return;
    }
    saveStatus = { state: "saving", message: "" };
    renderSaveStatus();

    var score = computeScore();
    var pct = score.max > 0 ? Math.round((score.total / score.max) * 100) : 0;
    var tier = tierFor(pct);
    var payload = {
      marca: state.datos.marca,
      responsable: state.datos.responsable,
      correo: state.datos.correo,
      celular: state.datos.celular,
      instagram: state.datos.instagram,
      categoria: state.datos.categoria,
      sector: state.datos.sector,
      nicho: state.datos.nicho,
      micronicho: state.datos.micronicho,
      tiempo_operando: state.datos.tiempo_operando,
      expectativas: state.datos.expectativas,
      puntaje_pct: pct,
      veredicto: tier.label,
      respuestas_detalle: JSON.stringify(state.respuestas),
      _subject: "Nueva evaluación de marca: " + (state.datos.marca || "(sin nombre)")
    };

    fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (res.ok) {
        saveStatus = { state: "ok", message: "" };
      } else {
        saveStatus = { state: "error", message: "No se pudo enviar (código " + res.status + ")." };
      }
      renderSaveStatus();
    }).catch(function () {
      saveStatus = { state: "error", message: "No se pudo conectar — revisa tu internet." };
      renderSaveStatus();
    });
  }

  function renderSaveStatus() {
    var el2 = document.getElementById("saveStatus");
    if (!el2) return;
    if (saveStatus.state === "saving") {
      el2.textContent = "Guardando tu evaluación...";
      el2.style.color = "var(--fg-muted)";
    } else if (saveStatus.state === "ok") {
      el2.textContent = "✓ Evaluación enviada correctamente.";
      el2.style.color = "var(--good)";
    } else if (saveStatus.state === "error") {
      el2.textContent = saveStatus.message || "No se pudo guardar.";
      el2.style.color = "var(--crit)";
    } else {
      el2.textContent = "";
    }
  }

  render();
})();
</script>
</body>
</html>
